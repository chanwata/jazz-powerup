<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e7">
  <meta name="description" content="チャーリー・パーカー以降のジャズを、歴史、和声、リズム、ベース演奏、耳から横断して学ぶ実践教材。">
  <title>JAZZ / AFTER PARKER — Bass & Listening Lab</title>
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/dashboard.css">
  <link rel="stylesheet" href="./src/score-lab.css">
  <link rel="stylesheet" href="./src/journal.css">
  <link rel="stylesheet" href="./src/atlas.css">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/home" aria-label="JAZZ AFTER PARKER ホーム">
      <span class="brand-mark">J<span>•</span>P</span>
      <span class="brand-name">AFTER PARKER <small>JAZZ / BASS / LISTENING</small></span>
    </a>
    <nav class="top-nav" aria-label="教材メニュー">
      <button data-view="home" class="nav-btn active">ホーム</button>
      <button data-view="lesson" class="nav-btn">レッスン</button>
      <button data-view="ear" class="nav-btn">耳トレ</button>
      <button data-view="keyboard" class="nav-btn">鍵盤</button>
      <button data-view="index" class="nav-btn">人と名盤</button>
      <button data-view="journal" class="nav-btn">学習ログ</button>
    </nav>
  </header>
  <div class="shell">
    <aside class="side" aria-label="レッスン一覧">
      <div class="side-header">
        <p class="overline">YOUR LEARNING MAP</p>
        <div class="completion-head"><span id="progress-summary">0 / 14 完了</span><span id="progress-percent">0%</span></div>
        <div class="progress-track"><div id="progress-bar"></div></div>
      </div>
      <label class="search-label" for="lesson-search">レッスンを探す</label>
      <input type="search" id="lesson-search" placeholder="人物・用語・年代で検索">
      <div id="lesson-menu" class="lesson-menu"></div>
      <div class="side-foot">制作思想：音を聴く → 構造を理解 → ベースで試す。</div>
    </aside>
    <main id="app" class="main" tabindex="-1"><p class="loading">教材を読み込み中…</p></main>
  </div>
  <footer class="site-footer">AFTER PARKER — 独立した学習教材。音源へのリンクは各権利者のサービスで開きます。音程練習用の音はブラウザ内で生成します。</footer>
  <script type="module" src="./src/app.js"></script>
  <script type="module" src="./src/score-lab.js"></script>
</body>
</html>
