name: Bootstrap Jazz Powerup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: jazz-bootstrap
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore course source if required
        shell: bash
        run: |
          if test -f .course-source.tar.xz; then
            tar -xJf .course-source.tar.xz
            sed -i 's/jazz-after-parker/jazz-powerup/g' package.json README.md
            mkdir -p docs
            mv .github/workflows/pages.yml docs/pages.yml.example
            rm .course-source.tar.xz
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify lessons and compile
        run: |
          npm test
          npm run build
      - name: Save readable source files to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install complete Jazz Powerup course source"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish site
        id: deploy
        uses: actions/deploy-pages@v4
